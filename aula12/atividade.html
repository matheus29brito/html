<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mídia em HTML — Cafeteria Grão Dourado</title>
</head>
<body>

  <h1>Explicações do novo sistema de ordem - O Ordem Pananormal 2</h1>
  <p>Vídeo, áudio, YouTube e PDF em uma única página.</p>

  <!-- ===== VÍDEO ===== -->
  <h2>Vídeo missão gratis</h2>
  <video width="660" height="400" controls poster=" preload="metadata" >
    <source src="Atividade/Video_ex.mp4" type="video/mp4">
    <source src="Atividade/cafe.webm" type="video/webm">
    Seu navegador não suporta vídeo.
    <a href="Atividade/Video_ex.mp4">Baixe o vídeo (MP4)</a>.
  </video>

  <!-- ===== ÁUDIO ===== -->
  <h2>Trilha sonora</h2>
  <audio controls>
    <source src="Atividade/Trilha_sonora.mp3" type="audio/mpeg">
    <source src="Atividade/Trilha_sonora.ogg" type="audio/ogg">
    Seu navegador não suporta áudio.
    <a href="Atividade/Trilha_sonora.mp3">Baixe a vinheta (MP3)</a>.
  </audio>

  <!-- ===== YOUTUBE ===== -->
  <h2>Como jogar no novo sistema</h2>
  <!-- Troque SEU_ID_DO_VIDEO pelo código que aparece depois de "v=" no endereço do vídeo -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/BKLpkkT5M9w?si=twlfNOQNEygRJEoz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <!-- ===== PDF ===== -->
  <h2>Entenda mais sobre a Ordem</h2>
  <object data="Atividade/Ordem.pdf" type="application/pdf" width="640" height="400">
    Seu navegador não mostra PDF aqui.
    <a href="Atividade/Ordem.pdf">Abra a Ordem em PDF</a>.
  </object>

</body>
</html>
