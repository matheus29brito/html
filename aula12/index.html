<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mídia em HTML — Cafeteria Grão Dourado</title>
</head>
<body>
  <a href="../index.html"><button style="background-color: rgb(94, 2, 2); color: #ff7777; 
        width : 70px; height: 30px; 
        color:#fff;
        border: 2px solid #fff ;
        border-radius: 10px">voltar</button></a>

        <a href="./atividade.html"><button style="background-color: rgb(94, 2, 2); color: #ff7777; 
        width : 70px; height: 30px; 
        color:#fff;
        border: 2px solid #fff ;
        border-radius: 10px">atividade</button></a>

  <h1>☕ Cafeteria Grão Dourado</h1>
  <p>Vídeo, áudio, YouTube e PDF em uma única página.</p>

  <!-- ===== VÍDEO ===== -->
  <h2>Nosso vídeo</h2>
  <video width="360" height="640" controls poster="imagem/poster.jpg" preload="metadata" autoplay muted loop = >
    <source src="video/Video_exemplo.mp4" type="video/mp4">
    <source src="video/cafe.webm" type="video/webm">
    <track src="video/legenda.vtt" kind="subtitles" srclang="pt" label="Português" default>
    Seu navegador não suporta vídeo.
    <a href="video/Video_exemplo.mp4">Baixe o vídeo (MP4)</a>.
  </video>

  <!-- ===== ÁUDIO ===== -->
  <h2>Nossa vinheta</h2>
  <audio controls>
    <source src="video/Audio_exemplo.m4a" type="audio/mp4">
<source src="audio/Audio_exemplo.m4a" type="audio/ogg">
    Seu navegador não suporta áudio.
    <a href="audio/Audio_exemplo.m4a">Baixe a vinheta (MP3)</a>.
  </audio>

  <!-- ===== YOUTUBE ===== -->
  <h2>Vídeo do YouTube</h2>
  <!-- Troque SEU_ID_DO_VIDEO pelo código que aparece depois de "v=" no endereço do vídeo -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/BKLpkkT5M9w?si=twlfNOQNEygRJEoz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <!-- ===== PDF ===== -->
  <h2>Nosso cardápio</h2>
  <object data="docs/cardapio.pdf" type="application/pdf" width="640" height="400">
    Seu navegador não mostra PDF aqui.
    <a href="docs/cardapio.pdf">Abra o cardápio em PDF</a>.
  </object>

</body>
</html>
