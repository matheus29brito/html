<!DOCTYPE html>
<html lang="pt-br">
<head>
    <style>
    p {
        color: #741a1a;
        font-family: Arial, sans-serif;
    }
    h1{
        color:#741a1a;
        font-family: Comic Sans MS, cursive;
    }
    header {
        background-color: #741a1a;
        text-align: center;
    }
    header h1 {
        color: #ffffff;
    }
    header p {
        color: #ffffff;
    }
    body {
        background-color: #f5f5dc;
        margin: 0;
    }
    section {
        background-color: #fff;
        border-radius: 10px;
        border: 2px solid #d4a373;
        padding: 16px;
        margin-bottom: 16px
    }
    section h3 {
        color: #754410;
        font-family: 'Courier New', Courier, monospace;
        font-size: 22px; 
    }
    section p {
        color: #754410;
        font-family: Arial,sans-serif;
        font-size: 16px; 
    }
    main {
      width:400px;
      margin: 0 auto;
    }
    main h2 {
      color: #8B4513;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
    }
    footer{
        background-color: #741a1a;
        color: #ffffff;
        text-align: center;
        padding: 8px;
        font-family: Arial, sans-serif;
    }
    nav {
        padding: 8px;
        text-align: center;
    }
    nav a {
        color: #f7f6f5;
        text-decoration: none;
        margin: 0 8px;
        font-family: Arial, sans-serif;
    }
    </style>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
    
</head>
<body>

  <header>
    <h1 >☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

        width : 80px; height: 40px;

        border: 2px solid #fff ;
        border-radius: 10px">voltar</button></a>
</body>
</html>
